<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이화미술공작소 - 공간 안내</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap');
    
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #faf9f7;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 50px 24px;
      text-align: center;
    }
    .tag {
      display: inline-block;
      padding: 6px 16px;
      background: #eef2ff;
      color: #4f46e5;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      color: #111;
      margin: 0 0 16px 0;
      word-break: keep-all;
    }
    p.desc {
      font-size: 17px;
      line-height: 1.6;
      color: #555;
      margin: 0 0 40px 0;
      word-break: keep-all;
    }
    .image-wrapper {
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      margin-bottom: 50px;
      background-color: #fff;
      padding: 12px;
    }
    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      transition: transform 0.3s ease;
    }
    .image-wrapper:hover img {
      transform: scale(1.02);
    }
    .footer {
      border-top: 1px solid #e5e7eb;
      padding-top: 40px;
    }
    .btn-close {
      display: inline-block;
      padding: 14px 44px;
      background-color: #212529;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-close:hover {
      background-color: #343a40;
      transform: translateY(-2px);
    }
    .btn-close:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tag">Studio Space</div>
    <h1>아이들의 꿈이 자라나는 공간</h1>
    <p class="desc">창의력과 상상력이 자유롭게 펼쳐지는 이화미술공작소의 내부를 소개합니다.<br>편안하고 감각적인 환경에서 아이들은 자신만의 예술 세계를 마음껏 그려나갑니다.</p>
    
    <div class="image-wrapper">
      <img src="img/공간01.PNG" alt="이화미술공작소 공간 이미지">
    </div>

    <div class="footer">
      <button class="btn-close" onclick="window.close();">닫기</button>
    </div>
  </div>
</body>
</html>
