<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이화미술공작소 - 작품 갤러리</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAF8;
      --card-bg: #FFFFFF;
      --charcoal: #2D2D2D;
      --muted: #8A8A8A;
      --accent: #C4956A;
      --warm-white: #FDFCFB;
      --border: #F0E8DC;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--charcoal);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--warm-white);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.03);
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(253, 252, 251, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .back-btn {
      text-decoration: none;
      color: var(--charcoal);
      font-size: 24px;
      line-height: 1;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #FAFAF8;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--border);
    }

    .header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 500;
      margin: 0;
    }

    .gallery-desc {
      padding: 30px 20px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 300;
    }

    .cards-container {
      padding: 0 20px 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--charcoal);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(196, 149, 106, 0.05);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 8px 25px rgba(196, 149, 106, 0.15);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-icon {
      font-size: 36px;
      margin-bottom: 15px;
      background: #FAFAF8;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .card:hover .card-icon {
      transform: scale(1.1);
      background: #F0E8DC;
    }

    .card-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 6px;
      text-align: center;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--muted);
      font-weight: 300;
      text-align: center;
    }

    .footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
      border-top: 1px solid var(--border);
      font-family: 'Cormorant Garamond', serif;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-btn">←</a>
      <h1 class="header-title">ARTWORKS</h1>
    </div>

    <div class="gallery-desc">
      이화미술공작소 아이들의 멋진 작품들을 감상해보세요.
    </div>

    <div class="cards-container">
      <a href="https://m.blog.naver.com/sodamc93/clip/8284755" class="card" target="_blank">
        <div class="card-icon">🖍️</div>
        <div class="card-title">유치부</div>
        <div class="card-subtitle">자유로운 상상력</div>
      </a>

      <a href="https://m.blog.naver.com/sodamc93/clip/8286847" class="card" target="_blank">
        <div class="card-icon">🎨</div>
        <div class="card-title">초등 1~3학년</div>
        <div class="card-subtitle">색채와 기초 표현</div>
      </a>

      <a href="https://m.blog.naver.com/sodamc93/clip/8297119" class="card" target="_blank">
        <div class="card-icon">🖌️</div>
        <div class="card-title">초등 4~6학년</div>
        <div class="card-subtitle">심화 기법과 관찰</div>
      </a>

      <a href="https://m.blog.naver.com/sodamc93/clip/8300131" class="card" target="_blank">
        <div class="card-icon">🖼️</div>
        <div class="card-title">중등부</div>
        <div class="card-subtitle">포트폴리오 및 심화</div>
      </a>
    </div>

    <div class="footer">ewah art · 이화미술공작소</div>
  </div>
</body>

</html>
