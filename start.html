<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #F7F0E8;
    --warm-white: #FDFAF5;
    --charcoal: #2C2A27;
    --muted: #8A8278;
    --accent: #C4956A;
    --accent-light: #E8D5BC;
    --border: rgba(196, 149, 106, 0.3);
  }

  body {
    background: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
  }

  .phone-frame {
    width: 390px;
    min-height: 844px;
    background: var(--warm-white);
    position: relative;
    overflow: hidden;
  }

  /* 배경 장식 */
  .bg-deco {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 340px;
    background: linear-gradient(160deg, #F0E8DC 0%, #E8D9C4 40%, #F7F0E8 100%);
    z-index: 0;
  }

  .bg-deco::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,149,106,0.15) 0%, transparent 70%);
  }

  .bg-deco::after {
    content: '';
    position: absolute;
    bottom: 20px; left: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,149,106,0.1) 0%, transparent 70%);
  }

  /* 상단 바 */
  .top-bar {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px 10px;
  }

  .lang-toggle {
    display: flex;
    gap: 2px;
    background: rgba(255,255,255,0.7);
    border-radius: 20px;
    padding: 4px 6px;
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
  }

  .lang-btn {
    font-size: 11px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--muted);
    padding: 3px 10px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }

  .lang-btn.active {
    background: var(--accent);
    color: white;
  }

  .top-icons {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .icon-btn {
    width: 34px; height: 34px;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    color: var(--charcoal);
    font-size: 14px;
    transition: all 0.2s;
  }

  .icon-btn:hover { background: white; transform: scale(1.05); }

  /* 프로필 섹션 */
  .profile-section {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 20px;
  }

  .avatar-wrap {
    position: relative;
    margin-bottom: 6px;
  }

  .avatar-ring {
    width: 100px; height: 100px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--accent), #E8C49A, var(--accent));
    animation: ring-spin 6s linear infinite;
  }

  @keyframes ring-spin {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(20deg) brightness(1.05); }
  }

  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(145deg, #F0E0CC, #E8C9A8);
    border: 3px solid var(--warm-white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    overflow: hidden;
  }

  /* 인스타 스토리 링 효과 */
  .story-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    background: linear-gradient(var(--warm-white), var(--warm-white)) padding-box,
                linear-gradient(135deg, #C4956A, #E8B88A, #C4956A, #A07848) border-box;
    animation: story-pulse 3s ease-in-out infinite;
  }

  @keyframes story-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* 인스타 스타일 스탯 */
  .insta-stats {
    display: flex;
    gap: 0;
    margin: 14px 0 10px;
    background: rgba(255,255,255,0.6);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    backdrop-filter: blur(8px);
  }

  .stat-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 8px;
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
  }

  .stat-item:not(:last-child)::after {
    content: '';
    position: absolute;
    right: 0; top: 20%; bottom: 20%;
    width: 1px;
    background: var(--border);
  }

  .stat-item:hover { background: rgba(196,149,106,0.08); }

  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--charcoal);
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 300;
    letter-spacing: 0.3px;
  }

  .handle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 1.5px;
    margin-top: 10px;
  }

  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    color: var(--charcoal);
    letter-spacing: 3px;
    margin-top: 4px;
    line-height: 1;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-top: 5px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .bio {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    line-height: 1.7;
    font-weight: 300;
    max-width: 260px;
  }

  /* 인스타 하이라이트 스타일 */
  .highlights {
    display: flex;
    gap: 14px;
    padding: 4px 24px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    position: relative;
    z-index: 5;
    justify-content: center;
  }

  .highlight-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .highlight-ring {
    width: 58px; height: 58px;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(135deg, var(--accent), #E8C49A);
  }

  .highlight-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(145deg, #F0E8DC, #E8D5BC);
    border: 2px solid var(--warm-white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .highlight-label {
    font-size: 10px;
    color: var(--charcoal);
    font-weight: 300;
    letter-spacing: 0.2px;
  }

  /* 링크 섹션 */
  .links-section {
    padding: 8px 24px 32px;
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .section-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 4px;
    font-weight: 400;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.75);
    border: 1px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
    text-decoration: none;
  }

  .link-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(196,149,106,0.06) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .link-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(196,149,106,0.2);
    border-color: var(--accent);
  }

  .link-card:hover::before { opacity: 1; }

  .link-card:active { transform: scale(0.98); }

  .link-icon-wrap {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(145deg, #F0E8DC, #E8D5BC);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
    overflow: hidden;
  }

  .link-icon-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 12px;
  }

  .link-text {
    flex: 1;
  }

  .link-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--charcoal);
    letter-spacing: 0.3px;
  }

  .link-desc {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-weight: 300;
  }

  .link-arrow {
    color: var(--accent);
    font-size: 16px;
    opacity: 0.6;
    transition: all 0.2s;
  }

  .link-card:hover .link-arrow {
    opacity: 1;
    transform: translateX(2px);
  }

  /* 카카오 특별 스타일 */
  .kakao-icon {
    background: #FEE500;
    border-radius: 12px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  /* 네이버 블로그 */
  .naver-icon {
    background: #03C75A;
    border-radius: 12px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: white;
    flex-shrink: 0;
  }

  /* 인스타 아이콘 */
  .insta-icon {
    background: linear-gradient(135deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
    border-radius: 12px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    color: white;
  }

  /* 구분선 */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 4px 0;
  }

  /* 하단 watermark */
  .footer {
    text-align: center;
    padding: 0 0 28px;
    font-size: 10px;
    color: var(--accent-light);
    letter-spacing: 1px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    position: relative;
    z-index: 5;
  }

  /* 팔로우 버튼 */
  .follow-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    width: 100%;
    max-width: 280px;
  }

  .btn-follow {
    flex: 1;
    padding: 9px 0;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .btn-follow:hover { background: #B08458; transform: translateY(-1px); }

  .btn-msg {
    flex: 1;
    padding: 9px 0;
    background: transparent;
    color: var(--charcoal);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .btn-msg:hover { background: rgba(196,149,106,0.08); transform: translateY(-1px); }

  /* 애니메이션 */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .profile-section { animation: fadeInUp 0.5s ease forwards; }
  .link-card:nth-child(1) { animation: fadeInUp 0.4s 0.2s ease both; }
  .link-card:nth-child(2) { animation: fadeInUp 0.4s 0.3s ease both; }
  .link-card:nth-child(3) { animation: fadeInUp 0.4s 0.4s ease both; }
  .link-card:nth-child(4) { animation: fadeInUp 0.4s 0.5s ease both; }
  .link-card:nth-child(5) { animation: fadeInUp 0.4s 0.6s ease both; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="bg-deco"></div>

  <!-- 상단 바 -->
  <div class="top-bar">
    <div class="lang-toggle">
      <span class="lang-btn active">한국어</span>
      <span class="lang-btn">ENG</span>
    </div>
    <div class="top-icons">
      <div class="icon-btn">↑</div>
      <div class="icon-btn">✕</div>
    </div>
  </div>

  <!-- 프로필 -->
  <div class="profile-section">
    <div class="avatar-wrap">
      <div class="story-ring"></div>
      <div class="avatar-ring">
        <div class="avatar-inner">🎨</div>
      </div>
    </div>

    <div class="handle">@ewah_art</div>
    <div class="brand-name">EWAH ART</div>
    <div class="brand-sub">이화미술</div>

    <div class="bio">
      감성을 그리는 공간 🖌️<br>
      아이들의 창의력을 키워드리는 미술 교육
    </div>

    <!-- 팔로우 버튼 (인스타 스타일) -->
    <div class="follow-row">
      <button class="btn-follow">팔로우</button>
      <button class="btn-msg">메시지</button>
    </div>

    <!-- 인스타 스탯 -->
    <div class="insta-stats">
      <div class="stat-item">
        <span class="stat-num">248</span>
        <span class="stat-label">게시물</span>
      </div>
      <div class="stat-item">
        <span class="stat-num">1.2K</span>
        <span class="stat-label">팔로워</span>
      </div>
      <div class="stat-item">
        <span class="stat-num">186</span>
        <span class="stat-label">팔로잉</span>
      </div>
    </div>
  </div>

  <!-- 하이라이트 -->
  <div class="highlights">
    <div class="highlight-item">
      <div class="highlight-ring">
        <div class="highlight-circle">🖼️</div>
      </div>
      <span class="highlight-label">작품</span>
    </div>
    <div class="highlight-item">
      <div class="highlight-ring">
        <div class="highlight-circle">🎨</div>
      </div>
      <span class="highlight-label">수업</span>
    </div>
    <div class="highlight-item">
      <div class="highlight-ring">
        <div class="highlight-circle">🏫</div>
      </div>
      <span class="highlight-label">공간</span>
    </div>
    <div class="highlight-item">
      <div class="highlight-ring">
        <div class="highlight-circle">🏆</div>
      </div>
      <span class="highlight-label">수상</span>
    </div>
  </div>

  <!-- 링크 섹션 -->
  <div class="links-section">
    <div class="section-label">링크</div>

    <a class="link-card" href="#">
      <div class="link-icon-wrap">🎨</div>
      <div class="link-text">
        <div class="link-title">이화미술</div>
        <div class="link-desc">공식 홈페이지</div>
      </div>
      <span class="link-arrow">›</span>
    </a>

    <a class="link-card" href="#">
      <div class="link-icon-wrap">📍</div>
      <div class="link-text">
        <div class="link-title">이화미술 위치안내</div>
        <div class="link-desc">찾아오시는 길</div>
      </div>
      <span class="link-arrow">›</span>
    </a>

    <div class="divider"></div>

    <a class="link-card" href="#">
      <div class="kakao-icon">💬</div>
      <div class="link-text">
        <div class="link-title">1:1 카카오톡 채팅</div>
        <div class="link-desc">빠른 상담 문의</div>
      </div>
      <span class="link-arrow">›</span>
    </a>

    <a class="link-card" href="#">
      <div class="insta-icon">📷</div>
      <div class="link-text">
        <div class="link-title">인스타그램</div>
        <div class="link-desc">@ewah_art · 일상 & 작품</div>
      </div>
      <span class="link-arrow">›</span>
    </a>

    <a class="link-card" href="#">
      <div class="naver-icon">blog</div>
      <div class="link-text">
        <div class="link-title">네이버 블로그</div>
        <div class="link-desc">수업 후기 & 미술 이야기</div>
      </div>
      <span class="link-arrow">›</span>
    </a>
  </div>

  <div class="footer">ewah art · 이화미술</div>
</div>
</body>
</html>
